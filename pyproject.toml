[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-database-crud"
version = "1.0.0"
description = "Flask administration UI for a relational employee training database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
    "gunicorn>=22,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["crud_app*"]

[tool.setuptools.package-data]
crud_app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
